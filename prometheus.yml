global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'hitscord'
    static_configs:
      - targets: ['hitscord:80']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: postgres_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgres
          __path__: /var/lib/docker/containers/*/*-json.log

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']