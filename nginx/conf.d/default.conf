map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name hitscord.site www.hitscord.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hitscord.site www.hitscord.site;

    ssl_certificate     /etc/letsencrypt/live/hitscord.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hitscord.site/privkey.pem;

    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    location /api/wss {
        proxy_pass http://hitscord:80;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://hitscord:80/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}